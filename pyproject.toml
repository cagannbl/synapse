[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "synapse-lang"
version = "3.0.0"
description = "Synapse AI-Native Programming Language"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
]

[project.scripts]
synapse = "synapse.cli:main"

[tool.setuptools.packages.find]
include = ["synapse*"]
